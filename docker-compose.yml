services:
  api:
    build: .
    env_file:
      - .env
    environment:
      ATT_ENVIRONMENT: ${ATT_ENVIRONMENT:-development}
      ATT_LOG_LEVEL: ${ATT_LOG_LEVEL:-INFO}
      ATT_DATABASE_URL: ${ATT_DATABASE_URL:?Set ATT_DATABASE_URL in .env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: attestra
      POSTGRES_USER: attestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attestra -d attestra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
