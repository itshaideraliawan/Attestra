[project]
name = "attestra"
version = "0.1.0"
description = "AI governance service for Stratagix products"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "opentelemetry-api>=1.28,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1.0",
    "opentelemetry-sdk>=1.28,<2.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "structlog>=24.4,<26.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestra"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/attestra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
